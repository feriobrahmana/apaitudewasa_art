<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Living Canvas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="canvas-container">
        <canvas id="paintCanvas"></canvas>
        <canvas id="textCanvas"></canvas>
    </div>

    <div id="ui-container">
        <button id="ui-toggle" aria-label="Toggle Contribution Panel">
            <span class="icon">Contribute</span>
        </button>

        <div id="ui-panel" class="hidden">
            <h1 class="title">Living Canvas</h1>
            <p class="prompt">What does adulthood mean to you?</p>

            <div class="input-group">
                <input type="text" id="wordInput" placeholder="One word..." maxlength="40" autocomplete="off">
            </div>

            <p class="prompt-small">What color and shape represent your word?</p>
            <div class="preview-container">
                <!-- Canvases for live preview of shape + color -->
                <canvas id="previewCanvas" width="240" height="60"></canvas>
            </div>

            <div class="sliders">
                <div class="slider-row">
                    <label>R</label>
                    <input type="range" id="rSlider" min="0" max="255" value="100">
                </div>
                <div class="slider-row">
                    <label>G</label>
                    <input type="range" id="gSlider" min="0" max="255" value="100">
                </div>
                <div class="slider-row">
                    <label>B</label>
                    <input type="range" id="bSlider" min="0" max="255" value="200">
                </div>
            </div>

            <p class="prompt-small">How complex is the shape?</p>
            <div class="sliders">
                <div class="slider-row">
                    <label>C</label>
                    <input type="range" id="cSlider" min="0" max="100" value="50">
                </div>
            </div>

            <div class="actions">
                <button id="paintBtn" disabled>Add to Canvas</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
